<!DOCTYPE html>
<html>
	<head>
		<title>Page Title</title>
		<link rel="stylesheet" href="styles.css">
		<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

	</head>

	<body>
	<h2> PSA DATA ni SYMOND11</h2>

		What is your First Name?
		<input id='name' type='text'>

		What is your Last Name?
		<input id='last_name' type='text'>

		Address
		<input id='address' type='text'>

		Age?
		<input id='age' type='text'>

		Work
		<input id='work' type='text'>

		Civil status
		<input id='civil' type='text'>

		Love language
		<input id='love' type='text'>

		Place of Birth
		<input id='place_birth' type='text'>
		
		Date of Birth
		<input id='date_birth' type='text'>

		Time of Birth
		<input id='time_birth' type='text'>




		<button type="button" onclick="clickButton( document.getElementById('name').value ,document.getElementById('last_name').value ,
		document.getElementById('address').value, document.getElementById('age').value,document.getElementById('work').value, 
		document.getElementById('civil').value, document.getElementById('love').value ,document.getElementById('place_birth').value ,document.getElementById('time_birth').value ,document.getElementById('last_name').value)">Click Me!</button>

		<script>



		const clickButton = (a,b,c,d,e,f,g,h,i) =>{

			const postData = {
				name:a,
				last_name :b,
				address :c,
				age: d,
				work: e,
				civil: f,
				love: g,
				place_birth : g,
				date_birth : h,
				time_birth :i
			};

			const data = {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json'
				},
				body: JSON.stringify(postData)
			}
	
			async function fetchData() {
				try {
					const response = await fetch('http://127.0.0.1:8000/survey',data);
					console.log(response)
					if (response.data.status =='success') {
						document.location.href = 'profile.html.html';
					} else {
						throw new Error('Failed to fetch data');
					}
				} catch (error) {
					console.error('Error:', error); 
				}
			}

			fetchData()
	
		}

		</script>
	</body>
</html>
